version: "3.9"

services:
  api:
    build: .
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    restart: unless-stopped

  celery-worker:
    build: .
    command: celery -A app.celery_app.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    restart: unless-stopped